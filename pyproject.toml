[project]
name = "sdanalysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bence Mitlasoczki", email = "mitlabence111@gmail.com" }
]
requires-python = "==3.10.*"
dependencies = [
    "blosc2==2.7.1",
    "caiman",
    "duckdb==1.1.3",
    "future==1.0.0",
    "ndindex==1.9.2",
    "numpy==1.26.4",
    "opencv-contrib-python==4.10.0.84",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pillow==11.0.0",
    "pims-nd2==1.1",
    "py-cpuinfo==9.0.0",
    "pyabf==2.3.8",
    "tables==3.10.1",
]

[project.scripts]
sdanalysis = "sdanalysis:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
caiman = { git = "https://github.com/flatironinstitute/CaImAn.git", rev = "v1.11.3" }
